flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FDF8F0"
  adaptive_icon_foreground: "assets/images/app_icon.png"

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FDF8F0"

  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FDF8F0"
    theme_color: "#FDF8F0"

  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/images/app_icon.png"